// ╔══════════════════════════════════════════════════════════╗
// ║  Firebase config — Firebase Console에서 복사해 넣으세요   ║

const firebaseConfig = {
  apiKey: "AIzaSyCq0l2RDh6LYUWgSG0pUWw8uBvsq5GNFVQ",
  authDomain: "marcus-coaching.firebaseapp.com",
  projectId: "marcus-coaching",
  storageBucket: "marcus-coaching.firebasestorage.app",
  messagingSenderId: "611003877918",
  appId: "1:611003877918:web:8f9b6ab9c07d369d55bc0f"
};

let db = null;
let firebaseReady = false;
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
} catch(e) {}

// ═══ DATA LAYER ═══
const DS = {
  async save(col, id, data) {
    try {
      if (firebaseReady) await db.collection(col).doc(id).set(data, { merge: true });
      localStorage.setItem(`lyu_${col}_${id}`, JSON.stringify({ ...data, _id: id }));
    } catch(e) {}
  },
  async load(col, id) {
    try {
      if (firebaseReady) {
        const doc = await db.collection(col).doc(id).get();
        if (doc.exists) return doc.data();
      }
      const l = localStorage.getItem(`lyu_${col}_${id}`);
      return l ? JSON.parse(l) : null;
    } catch(e) {
      const l = localStorage.getItem(`lyu_${col}_${id}`);
      return l ? JSON.parse(l) : null;
    }
  },
  async loadAll(col) {
    try {
      if (firebaseReady) {
        const snap = await db.collection(col).get();
        const res = [];
        snap.forEach(d => res.push({ _id: d.id, ...d.data() }));
        if (res.length) return res;
      }
    } catch(e) {}
    const res = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(`lyu_${col}_`)) {
        try { res.push(JSON.parse(localStorage.getItem(k))); } catch(e) {}
      }
    }
    return res;
  },
  async remove(col, id) {
    try {
      if (firebaseReady) await db.collection(col).doc(id).delete();
      localStorage.removeItem(`lyu_${col}_${id}`);
    } catch(e) {}
  }
};
</script>

function updateStudent(id, changes) {
  state.students = state.students.map(s => s.id === id ? { ...s, ...changes } : s);
  autoSave(); render();

function getStudent() { return state.students.find(s => s.id === state.selectedId); }

function normalizePin(p) { return (p || "").trim().toUpperCase(); }
function checkTeacherPin(p) { return normalizePin(p) === normalizePin(TEACHER_PIN); }
function checkStudentPin(student, p) { return normalizePin(p) === normalizePin(student.pin || ""); }
function validatePinFormat(p) {
  const norm = normalizePin(p);
  return /^[A-Z][0-9]{5}$/.test(norm);
}

// ── MONTH KEY ──
function monthKey(y, m) { return `${y}-${String(m).padStart(2,'0')}`; }
function monthLabel(key) {
  const [y, m] = key.split("-");
  return `${y}년 ${parseInt(m)}월`;
}
function currentMonthKey() {
  const now = new Date();
  return monthKey(now.getFullYear(), now.getMonth() + 1);
}

function getReports(studentId) {
  const s = getStudentById(studentId);
  return (s && s.monthlyReports) ? s.monthlyReports : [];
}
function getReport(studentId, mk) {
  return getReports(studentId).find(r => r.monthKey === mk) || null;
}
function saveReport(studentId, mk, data) {
  const s = getStudentById(studentId);
  if (!s) return;
  let reports = [...(s.monthlyReports || [])];
  const idx = reports.findIndex(r => r.monthKey === mk);
  const report = { monthKey: mk, ...data, updatedAt: new Date().toISOString() };
  if (idx >= 0) reports[idx] = report;
  else reports.unshift(report);
  updateStudent(studentId, { monthlyReports: reports });
}

// ── RENDER HELPERS ──
function moodSVG(data, h=44) {
  if (!data || !data.length) return '';
  const max=10,min=1,range=max-min,w=data.length*22;
  let path=`M0,${h}`;data.forEach((d,i)=>{path+=` L${i*22},${h-((d-min)/range)*(h-10)-5}`;});path+=` L${(data.length-1)*22},${h} Z`;
  let line=data.map((d,i)=>`${i*22},${h-((d-min)/range)*(h-10)-5}`).join(" ");
  let dots=data.map((d,i)=>{const cy=h-((d-min)/range)*(h-10)-5;return`<circle cx="${i*22}" cy="${cy}" r="3.5" fill="#fff" stroke="#2D6A4F" stroke-width="2"/>`;}).join("");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible"><path d="${path}" fill="rgba(45,106,79,0.1)"/><polyline points="${line}" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function ringSVG(pct,size=60,sw=4) {
  const r=(size-sw)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E8E4DE" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2D6A4F" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c-(pct/100)*c}" stroke-linecap="round"/><text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" style="transform:rotate(90deg);transform-origin:center;font-size:${size*0.22}px;font-weight:800;fill:#1B1815">${pct}%</text></svg>`;
}
function courseTag(type) {
  const c={AP:{bg:"#FFF0F0",c:"#C62828"},Honors:{bg:"#E3F2FD",c:"#1565C0"},Regular:{bg:"#F0FAF5",c:"#2D6A4F"},IB:{bg:"#F3E8FF",c:"#6A1B9A"}};
  const t=c[type]||c.Regular;
  return `<span style="font-size:9px;font-weight:800;color:${t.c};background:${t.bg};padding:2px 7px;border-radius:10px">${type}</span>`;
}
function efn(value, onSave, style="", placeholder="입력하세요", multi=false) {
  const id="ef_"+Math.random().toString(36).substr(2,8);
  const disp=value||`<span style="color:#B0A99F;font-style:italic">${placeholder}</span>`;
  return `<span class="editable" id="${id}" style="${style}" onclick="startEdit('${id}',${multi})" data-value="${(value||'').replace(/"/g,'&quot;')}" data-onsave="${onSave}" title="클릭하여 수정">${disp}</span>`;
}
window.startEdit = function(id, multi) {
  const el=document.getElementById(id); if(!el||el.querySelector("input,textarea"))return;
  const val=el.dataset.value||""; const onSave=el.dataset.onsave; const style=el.style.cssText;
  el.innerHTML=multi?`<textarea class="edit-input" style="${style}" rows="3">${val}</textarea>`:`<input class="edit-input" style="${style}" value="${val.replace(/"/g,'&quot;')}">`;
  const inp=el.querySelector("input,textarea"); inp.focus();
  inp.addEventListener("blur",()=>{ eval(onSave.replace("__VAL__",JSON.stringify(inp.value))); });
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!multi) eval(onSave.replace("__VAL__",JSON.stringify(inp.value))); if(e.key==="Escape") render(); });
};

function crisisHTML(mood, routineRate) {
  const r=(mood||[]).slice(-3); const a=[];
  if(r.length>=3&&r.every((v,i)=>i===0||v<=r[i-1])&&r[2]<r[0]) a.push("무드 하락");
  if(routineRate<60) a.push("루틴 60% 미만");
  if(r.length&&r[r.length-1]<=4) a.push("최근 무드 4↓");
  if(!a.length) return "";
  return `<div style="background:#FFF0F0;border:1.5px solid #FF5252;border-radius:10px;padding:10px 14px;margin-bottom:12px"><span style="font-weight:700;font-size:12px;color:#C62828">🚨 ${a.join(" · ")}</span></div>`;
}

// ── EMAIL VIA APPS SCRIPT ──
async function sendReportEmail(student, report) {
  if (!state.appsScriptUrl) { alert("설정에서 Apps Script URL을 입력해주세요."); return; }
  const body = formatReportText(student, report);
  try {
    await fetch(state.appsScriptUrl, {
      method: "POST",
      body: JSON.stringify({
        to: state.teacherEmail,
        subject: `[Lit You Up] ${student.name} — ${monthLabel(report.monthKey)} 리포트`,
        body,
        studentName: student.name,
        month: report.monthKey
      })
    });
    alert("✅ 이메일이 발송됐습니다!");
  } catch(e) { alert("⚠️ 발송 실패. Apps Script URL을 확인해주세요."); }
}

function formatReportText(student, report) {
  return `Lit You Up — ${student.name} (${student.grade}학년)
${monthLabel(report.monthKey)} 월간 리포트
${'='.repeat(40)}

📊 학습 진도 & GPA
현재 GPA: ${report.gpa || '-'}
학업 현황: ${report.academicProgress || '-'}

🎯 이번 달 목표 & 달성
목표: ${report.goal || '-'}
달성 여부: ${report.goalResult || '-'}

🧠 태도 & 메타인지
${report.attitude || '-'}

🔄 루틴 & 습관
루틴 달성률: ${report.routineRate || '-'}%
습관 현황: ${report.habitNote || '-'}

💬 선생님 코멘트
${report.teacherComment || '-'}

📅 다음 달 계획
${report.nextPlan || '-'}

${'='.repeat(40)}
Lit You Up Consulting System`;
}

function renderStudentReports(studentId) {
  const st = getStudentById(studentId);
  if (!st) return '';
  const reports = [...(st.monthlyReports || [])].sort((a,b) => b.monthKey.localeCompare(a.monthKey));
  const editing = state.editingReport;
  const isEditingCur = editing && editing.studentId === studentId;
  const curMk = currentMonthKey();

  // 2026년 3월부터 현재까지 월 목록 생성
  const months = [];
  const startYear = 2026, startMonth = 3;
  const now2 = new Date();
  let y = startYear, m = startMonth;
  while (y < now2.getFullYear() || (y === now2.getFullYear() && m <= now2.getMonth() + 1)) {
    months.push(monthKey(y, m));
    m++; if (m > 12) { m = 1; y++; }
  }
  months.reverse();

  let html = `
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px">📅 월 선택 & 리포트 작성</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        ${months.map(mk => {
          const exists = reports.some(r => r.monthKey === mk);
          const isActive = isEditingCur && editing.monthKey === mk;
          return `<button onclick="state.editingReport={studentId:'${studentId}',monthKey:'${mk}'};render()"
            style="padding:6px 12px;border-radius:8px;border:2px solid ${isActive?'#1B4332':'#E8E4DE'};background:${isActive?'#1B4332':exists?'#E8F5E9':'white'};color:${isActive?'white':exists?'#1B4332':'#5A5550'};cursor:pointer;font-size:12px;font-weight:700;font-family:inherit">
            ${monthLabel(mk)}${exists?' ✓':''}
          </button>`;
        }).join('')}
      </div>
    </div>`;

  if (isEditingCur) {
    const mk = editing.monthKey;
    const r = getReport(studentId, mk) || {};
    html += reportEditor(studentId, mk, r, st);
  } else {
    html += `<div style="text-align:center;padding:30px;color:#9A958C;font-size:13px">위에서 월을 선택해 리포트를 작성하세요</div>`;
  }

  // History
  if (reports.length > 0) {
    html += `<div style="font-size:14px;font-weight:700;margin:20px 0 10px">📂 리포트 히스토리</div>`;
    html += reports.map(r => `
      <div class="history-item" onclick="state.editingReport={studentId:'${studentId}',monthKey:'${r.monthKey}'};render()">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="history-month">${monthLabel(r.monthKey)}</div>
          <span style="font-size:11px;color:#9A958C">${r.updatedAt ? new Date(r.updatedAt).toLocaleDateString('ko-KR') : ''}</span>
        </div>
        <div class="history-preview">${r.teacherComment ? `"${r.teacherComment.substring(0,60)}..."` : '리포트 작성됨'}</div>
      </div>`).join('');
  }

  return html;
}

window.emailReport = async function(studentId, mk) {
  window.saveCurrentReport(studentId, mk);
  await new Promise(r => setTimeout(r, 500));
  const st = getStudentById(studentId);
  const report = getReport(studentId, mk);
  if (!report) { alert("리포트를 먼저 저장해주세요."); return; }
  await sendReportEmail(st, report);
};

window.setPinForStudent = function(id) {

    document.getElementById("pinSetMsg").style.color = "#C62828";
    return;
  }
  updateStudent(id, { pin });
  document.getElementById("pinSetMsg").textContent = `✅ PIN이 ${pin}으로 설정됐습니다.`;
  document.getElementById("pinSetMsg").style.color = "#2D6A4F";
};

window.addStudentWithPin = function() {
  const name = document.getElementById("newName").value.trim();
  const school = document.getElementById("newSchool").value.trim();
  const grade = document.getElementById("newGrade").value;
  const pin = (document.getElementById("newPin").value || "").toUpperCase();
  if (!name) { alert("이름을 입력해주세요."); return; }
  if (!validatePinFormat(pin)) {
    document.getElementById("pinFormatErr").textContent = "PIN 형식 오류: 영문1 + 숫자5 (예: A12345)";
    return;
  }
  const id = "s" + Date.now();
  state.students.push({
    id, name, grade, school: school || "학교 미정", pin,
    interests: "", gpa: "0.00", narrative: "",
    courses: [], routineRate: 0,
    weeklyMood: [5,5,5,5,5,5,5],
    notes: "", activities: [],
    habits: [{name:"새 습관",streak:0,target:21,history:Array(21).fill(0)}],
    energy: Array(24).fill(5),
    exams: [], narrativeTimeline: [], monthlyReports: []
  });
  autoSave();
  document.getElementById("addModal").style.display = "none";
  document.getElementById("newName").value = "";
  document.getElementById("newSchool").value = "";
  document.getElementById("newPin").value = "";
  render();
};

window.removeStudent = function(id) {
  if (!confirm("정말 이 학생을 삭제하시겠습니까?")) return;
  state.students = state.students.filter(s => s.id !== id);
  if (state.selectedId === id) state.selectedId = null;
  DS.remove("students", id);
  autoSave(); render();
};

(function setupPWA() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#1B4332'; x.fillRect(0,0,512,512);
  const g = x.createRadialGradient(400,100,0,400,100,300);
  g.addColorStop(0,'rgba(82,183,136,0.3)'); g.addColorStop(1,'transparent');
  x.fillStyle = g; x.fillRect(0,0,512,512);
  x.fillStyle = '#F0C97A'; x.font = "bold 160px 'Georgia',serif";
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('LU',256,220);
  x.fillStyle = 'rgba(240,201,122,0.7)'; x.fillRect(80,310,352,2);
  x.fillStyle = 'rgba(255,255,255,0.8)'; x.font = '500 42px Georgia,serif';
  x.fillText('Lit You Up',256,360);
  const icon = c.toDataURL('image/png');
  const mf = {name:"Lit You Up",short_name:"LitYouUp",start_url:"./",display:"standalone",orientation:"any",background_color:"#1B4332",theme_color:"#1B4332",icons:[{src:icon,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:icon,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
  const ml = document.createElement("link"); ml.rel = "manifest"; ml.href = URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/json"})); document.head.appendChild(ml);
  const al = document.createElement("link"); al.rel = "apple-touch-icon"; al.href = icon; document.head.appendChild(al);
  const fl = document.createElement("link"); fl.rel = "icon"; fl.type = "image/png"; fl.href = icon; document.head.appendChild(fl);
  if ("serviceWorker" in navigator) {
    const sw = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
  }
})();
