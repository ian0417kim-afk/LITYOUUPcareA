// ═══ ACT: click registry - no onclick strings needed ═══
var _acts = [];
function act(fn) {
  _acts.push(fn);
  return 'data-act="' + (_acts.length-1) + '"';
}
document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var idx = parseInt(el.getAttribute('data-act'));
  if (typeof _acts[idx] === 'function') _acts[idx](e);
});

// ═══ DATA STORE ═══
var DS = {
  save:async function(col,id,data){
    try{if(firebaseReady)await db.collection(col).doc(id).set(data,{merge:true});}catch(e){}
    localStorage.setItem("lyu_"+col+"_"+id,JSON.stringify(Object.assign({},data,{_id:id})));
  },
  load:async function(col,id){
    try{if(firebaseReady){var d=await db.collection(col).doc(id).get();if(d.exists)return d.data();}}catch(e){}
    var l=localStorage.getItem("lyu_"+col+"_"+id);return l?JSON.parse(l):null;

    try{if(firebaseReady)await db.collection(col).doc(id).delete();}catch(e){}

  }

function showSaved(){var el=document.getElementById("saveInd");if(!el)return;el.classList.add("show");setTimeout(function(){el.classList.remove("show");},1800);}
function normalizePin(p){return(p||"").trim().toUpperCase();}
function checkTeacherPin(p){return normalizePin(p)===normalizePin(TEACHER_PIN);}
function checkStudentPin(st,p){return normalizePin(p)===normalizePin(st.pin||"");}
function validatePin(p){return /^[A-Z][0-9]{5}$/.test(normalizePin(p));}
function monthKey(y,m){return y+"-"+String(m).padStart(2,"0");}
function monthLabel(mk){var p=mk.split("-");return p[0]+"년 "+parseInt(p[1])+"월";}
function currentMonthKey(){var n=new Date();return monthKey(n.getFullYear(),n.getMonth()+1);}
function getMonths(){
  var months=[],y=2026,m=3,n=new Date(),ny=n.getFullYear(),nm=n.getMonth()+1;
  while(y<ny||(y===ny&&m<=nm)){months.push(monthKey(y,m));m++;if(m>12){m=1;y++;}}
  months.reverse();return months;
}
function getStudent(){return S.students.find(function(s){return s.id===S.selectedId;});}
function getStudentById(id){return S.students.find(function(s){return s.id===id;});}
function getReport(sid,mk){var s=getStudentById(sid);if(!s||!s.reports)return null;return s.reports.find(function(r){return r.monthKey===mk;})||null;}

function autoSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async function(){
    await DS.save("meta","student_ids",{ids:S.students.map(function(s){return s.id;})});
    for(var i=0;i<S.students.length;i++)await DS.save("students",S.students[i].id,S.students[i]);
    await DS.save("config","roadmap",S.roadmap);
    await DS.save("config","settings",{appsScriptUrl:S.appsScriptUrl,teacherEmail:S.teacherEmail});
    showSaved();
  },800);
}

async function loadData(){
  var meta=await DS.load("meta","student_ids");
  if(meta&&meta.ids&&meta.ids.length){
    var arr=[];
    for(var i=0;i<meta.ids.length;i++){var s=await DS.load("students",meta.ids[i]);if(s)arr.push(s);}
    S.students=arr.length?arr:defaultStudents();
  }else{S.students=defaultStudents();}
  var rm=await DS.load("config","roadmap");if(rm)S.roadmap=rm;
  var cfg=await DS.load("config","settings");
  if(cfg){S.appsScriptUrl=cfg.appsScriptUrl||"";S.teacherEmail=cfg.teacherEmail||"ginnie1004@gmail.com";}
  S.loaded=true;render();
}

function updateStudent(id,changes){
  S.students=S.students.map(function(s){return s.id===id?Object.assign({},s,changes):s;});
  autoSave();render();
}
function saveReport(sid,mk,data){
  S.students=S.students.map(function(s){
    if(s.id!==sid)return s;
    var rpts=(s.reports||[]).slice();
    var idx=rpts.findIndex(function(r){return r.monthKey===mk;});
    var rpt=Object.assign({monthKey:mk},data,{updatedAt:new Date().toISOString()});
    if(idx>=0)rpts[idx]=rpt;else rpts.unshift(rpt);
    return Object.assign({},s,{reports:rpts});
  });
  autoSave();
}

function fmtReport(st,r){
  var lines=["📋 Lit You Up — "+st.name+" 리포트",monthLabel(r.monthKey),"━━━━━━━━━━━━━━━━━━━━"];
  if(r.gpa)lines.push("📊 GPA: "+r.gpa);
  if(r.routineRate)lines.push("🔄 루틴: "+r.routineRate+"%");
  if(r.academicProgress)lines.push("\n📚 학습 진도:\n"+r.academicProgress);
  if(r.goal)lines.push("\n🎯 목표:\n"+r.goal);
  if(r.goalResult)lines.push("달성: "+r.goalResult);
  if(r.teacherComment)lines.push("\n💬 선생님 코멘트:\n"+r.teacherComment);
  if(r.nextPlan)lines.push("\n📅 다음 달:\n"+r.nextPlan);
  return lines.join("\n");
}

function shareKakao(sid,mk){
  var st=getStudentById(sid),r=getReport(sid,mk);
  if(!st||!r){alert("리포트를 먼저 저장해주세요.");return;}
  if(!st.kakaoLink){alert("PIN/연락처 탭에서 카카오 링크를 먼저 입력해주세요.");return;}
  var txt=fmtReport(st,r);
  var copy=function(){var ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;opacity:0;";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);};
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert("복사됐어요! 채팅창에 붙여넣기 하세요.");window.open(st.kakaoLink,"_blank");}).catch(function(){copy();alert("복사됐어요! 채팅창에 붙여넣기 하세요.");window.open(st.kakaoLink,"_blank");});}
  else{copy();alert("복사됐어요!");window.open(st.kakaoLink,"_blank");}
}

// ═══ RENDER HELPERS ═══
function g(id){var el=document.getElementById(id);return el?el.value.trim():"";}
function ringSVG(pct,sz,sw){
  sz=sz||60;sw=sw||4;var r=(sz-sw)/2,c=2*Math.PI*r;
  return '<svg width="'+sz+'" height="'+sz+'" style="transform:rotate(-90deg)"><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="#E8E4DE" stroke-width="'+sw+'"/><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="#2D6A4F" stroke-width="'+sw+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+( c-(pct/100)*c )+'" stroke-linecap="round"/><text x="'+sz/2+'" y="'+sz/2+'" text-anchor="middle" dominant-baseline="central" style="transform:rotate(90deg);transform-origin:center;font-size:'+Math.round(sz*0.22)+'px;font-weight:800;fill:#1B1815">'+pct+'%</text></svg>';
}
function cTag(type){
  var m={AP:{bg:"#FFF0F0",c:"#C62828"},Honors:{bg:"#E3F2FD",c:"#1565C0"},Regular:{bg:"#F0FAF5",c:"#2D6A4F"},IB:{bg:"#F3E8FF",c:"#6A1B9A"}};
  var t=m[type]||m.Regular;
  return '<span style="font-size:9px;font-weight:800;color:'+t.c+';background:'+t.bg+';padding:2px 7px;border-radius:10px">'+type+'</span>';
}

// efn: editable inline field
function efn(value,onSave,style,ph,multi){
  style=style||"";ph=ph||"입력하세요";multi=multi||false;
  var id="ef_"+Math.random().toString(36).substr(2,8);
  var disp=value||'<span style="color:#B0A99F;font-style:italic">'+ph+'</span>';
  var a=act(function(){startEdit(id,multi,onSave);});
  return '<span class="editable" id="'+id+'" '+a+' style="'+style+'" title="클릭하여 수정">'+disp+'</span>';
}
function startEdit(id,multi,onSave){
  var el=document.getElementById(id);if(!el||el.querySelector("input,textarea"))return;
  var val=el.textContent.trim()==="입력하세요"?"":el.textContent.trim();
  // Try to get original value from data
  el.innerHTML=multi?'<textarea class="edit-input" rows="3">'+val+'</textarea>':'<input class="edit-input" value="">';

        content+='<div style="text-align:center;padding:30px;color:#9A958C;font-size:13px">위에서 월을 선택해 리포트를 작성하세요</div>';
      }

      // History
      var histRpts=(stR.reports||[]).slice().sort(function(a,b){return b.monthKey.localeCompare(a.monthKey);});
      if(histRpts.length){
        content+='<div style="font-size:14px;font-weight:700;margin:20px 0 10px">📂 리포트 히스토리</div>';
        histRpts.forEach(function(r){
          var dt=r.updatedAt?new Date(r.updatedAt).toLocaleDateString("ko-KR"):"";
          content+='<div class="hist-item" '+act((function(id,mk){return function(){S.editingReport={studentId:id,monthKey:mk};render();};})(stR.id,r.monthKey))+'>'
            +'<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:14px;font-weight:800;color:#1B4332">'+ monthLabel(r.monthKey) +'</div><span style="font-size:11px;color:#9A958C">'+ dt +'</span></div>'
            +'<div style="font-size:12px;color:#7A7267;margin-top:4px">'+(r.teacherComment?'"'+ r.teacherComment.substring(0,60) +'..."':"리포트 작성됨")+'</div>'
            +'<div class="share-row"><button class="btn bk" style="font-size:11px;padding:5px 10px" '+act((function(id,mk){return function(e){e.stopPropagation();shareKakao(id,mk);};})(stR.id,r.monthKey))+'>💬 카카오톡</button><button class="btn bs" style="font-size:11px;padding:5px 10px" '+act((function(id,mk){return function(e){e.stopPropagation();shareSMS(id,mk);};})(stR.id,r.monthKey))+'>📱 문자</button></div></div>';
        });
      }
    }
  }

  // ── ROADMAP ──
  else if(s.tab==="roadmap"){
    var rmG=s.roadmapGrade||"9";
    var rmD=s.roadmap[rmG]||{title:"",sub:"",content:""};
    content+='<div class="st" style="margin-bottom:5px">◈ 학년별 로드맵</div><div class="ss">교사가 직접 작성 · 저장하면 학부모에게 바로 공개됩니다</div>';
    content+='<div style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap">';
    GRADES.forEach(function(gr){
      content+='<button style="padding:7px 12px;border-radius:10px;border:2px solid;cursor:pointer;font-weight:800;font-size:12px;font-family:inherit;background:'+(s.roadmapGrade===gr?"#1B4332":"white")+';color:'+(s.roadmapGrade===gr?"white":"#1B4332")+';border-color:'+(s.roadmapGrade===gr?"#1B4332":"#D1CBC0")+'" '+act((function(g){return function(){S.roadmapGrade=g;render();};})(gr))+'>'+ gr +'학년</button>';
    });
    content+='</div>';
    content+='<div class="card"><div style="font-size:16px;font-weight:800;color:#1B4332;margin-bottom:16px">'+ rmG +'학년 로드맵</div>'
      +'<div class="fg"><label class="lbl">제목 (예: Foundation)</label><input id="rmTitle" class="inp" value="'+(rmD.title||"")+'" placeholder="로드맵 제목"></div>'
      +'<div class="fg"><label class="lbl">부제목 (예: 기반 구축의 해)</label><input id="rmSub" class="inp" value="'+(rmD.sub||"")+'" placeholder="부제목"></div>'
      +'<div class="fg"><label class="lbl">내용 (줄바꿈으로 항목 구분)</label><textarea id="rmContent" class="ta" rows="10">'+(rmD.content||"")+'</textarea></div>'
      +'<button class="btn bp" '+act((function(g){return function(){var t=g("rmTitle"),sub=g("rmSub"),c=g("rmContent");S.roadmap[rmG]={title:t,sub:sub,content:c};autoSave();showSaved();};})(g))+'>💾 저장 (학부모에게 바로 공개)</button></div>';
  }

  // ── SETTINGS ──
  else if(s.tab==="settings"){
    content+='<div class="st" style="margin-bottom:5px">⚙️ 설정</div><div class="ss">시스템 설정</div>'
      +'<div class="card" style="margin-bottom:14px"><div style="font-size:15px;font-weight:700;margin-bottom:14px">📧 이메일 설정</div>'
      +'<div class="fg"><label class="lbl">교사 이메일</label><input id="cfgEmail" class="inp" type="email" value="'+ s.teacherEmail +'" placeholder="marcus@gmail.com"></div>'
      +'<div class="fg"><label class="lbl">Apps Script URL</label><input id="cfgScript" class="inp" type="text" value="'+ s.appsScriptUrl +'" placeholder="https://script.google.com/macros/s/..."></div>'
      +'<button class="btn bp" '+act(function(){S.appsScriptUrl=g("cfgScript");S.teacherEmail=g("cfgEmail");DS.save("config","settings",{appsScriptUrl:S.appsScriptUrl,teacherEmail:S.teacherEmail});var m=document.getElementById("cfgMsg");if(m)m.textContent="✅ 저장됐습니다.";})+'>저장</button><div id="cfgMsg" style="margin-top:8px;font-size:12px;color:#2D6A4F;font-weight:600"></div></div>'
      +'<div class="card"><div style="font-size:15px;font-weight:700;margin-bottom:12px">☁️ Firebase 상태</div><div style="font-size:13px;line-height:1.7;color:#5A5550">'+(firebaseReady?'<span style="color:#2D6A4F;font-weight:700">✅ Firebase 연동됨</span><br>교사가 저장하면 학부모가 즉시 볼 수 있습니다.':"<span style=\"color:#E65100;font-weight:700\">⚠️ Firebase 미연동</span>")+'</div></div>';
  }

  return content;
}

function saveRpt(sid,mk){
  saveReport(sid,mk,{gpa:g("rGpa"),routineRate:g("rRoutine"),academicProgress:g("rAcademic"),attitudeScore:g("rAttScore"),attitude:g("rAttitude"),goal:g("rGoal"),goalResult:g("rGoalResult"),habitNote:g("rHabit"),teacherComment:g("rComment"),nextPlan:g("rNext")});
  showSaved();
}

function doAddStudent(){
  var name=(g("nName")||"").trim(),school=(g("nSchool")||"").trim(),grade=(document.getElementById("nGrade")||{}).value||"9";
  var pin=((document.getElementById("nPin")||{}).value||"").toUpperCase();
  var phone=g("nPhone"),kakao=g("nKakao");
  if(!name){alert("이름을 입력해주세요.");return;}
  if(!validatePin(pin)){var err=document.getElementById("nPinErr");if(err)err.textContent="PIN 형식 오류: 영문1+숫자5 (예: A12345)";return;}
  S.students.push({id:"s"+Date.now(),name:name,grade:grade,school:school||"학교 미정",pin:pin,phone:phone,kakaoLink:kakao,interests:"",gpa:"0.00",narrative:"",routineRate:0,notes:"",courses:[],activities:[],narrativeTimeline:[],reports:[]});
  autoSave();document.getElementById("addModal").style.display="none";render();
}
function removeStudent(id){
  if(!confirm("정말 이 학생을 삭제하시겠습니까?"))return;
  S.students=S.students.filter(function(s){return s.id!==id;});
  if(S.selectedId===id)S.selectedId=null;
  DS.remove("students",id);autoSave();render();
}
function updateStudent(id,changes){
  S.students=S.students.map(function(s){return s.id===id?Object.assign({},s,changes):s;});
  autoSave();render();
}
