// ╔══════════════════════════════════════════════════════════════╗
// ║  🔥 여기에 Firebase config를 입력하세요                       ║
// ║  Firebase Console → 프로젝트 설정 → 웹 앱에서 복사            ║

  apiKey: "AIzaSyCq0l2RDh6LYUWgSG0pUWw8uBvsq5GNFVQ",

  projectId: "marcus-coaching",

  appId: "1:611003877918:web:8f9b6ab9c07d369d55bc0f"

// Firebase 초기화
let db = null;
let firebaseReady = false;
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
    console.log("✅ Firebase connected");
  } else {
    console.log("⚠️ Firebase config not set — using local storage fallback");
  }
} catch(e) {
  console.log("⚠️ Firebase init failed — using local storage fallback", e);
}

// ═══ DATA LAYER (Firebase + LocalStorage fallback) ═══
const DataStore = {
  async save(collection, id, data) {
    try {
      if (firebaseReady && db) {
        await db.collection(collection).doc(id).set(data, { merge: true });
      }
      // Always save to localStorage as backup
      const key = `lityouup_${collection}_${id}`;
      localStorage.setItem(key, JSON.stringify(data));
    } catch(e) { console.error("Save error:", e); }
  },

  async load(collection, id) {
    try {
      if (firebaseReady && db) {
        const doc = await db.collection(collection).doc(id).get();
        if (doc.exists) return doc.data();
      }
      // Fallback to localStorage
      const key = `lityouup_${collection}_${id}`;
      const local = localStorage.getItem(key);
      return local ? JSON.parse(local) : null;
    } catch(e) {
      console.error("Load error:", e);
      const key = `lityouup_${collection}_${id}`;
      const local = localStorage.getItem(key);
      return local ? JSON.parse(local) : null;
    }
  },

  async loadAll(collection) {
    try {
      if (firebaseReady && db) {
        const snapshot = await db.collection(collection).get();
        const results = [];
        snapshot.forEach(doc => results.push({ id: doc.id, ...doc.data() }));
        if (results.length > 0) return results;
      }
      // Fallback: scan localStorage
      const results = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith(`lityouup_${collection}_`)) {
          const data = JSON.parse(localStorage.getItem(key));
          results.push(data);
        }
      }
      return results;
    } catch(e) {
      console.error("LoadAll error:", e);
      return [];
    }
  },

  async remove(collection, id) {
    try {
      if (firebaseReady && db) {
        await db.collection(collection).doc(id).delete();
      }
      localStorage.removeItem(`lityouup_${collection}_${id}`);
    } catch(e) { console.error("Remove error:", e); }
  },

  async saveAllStudents(students) {
    // Save master list
    await this.save("meta", "student_ids", { ids: students.map(s => s.id) });
    // Save each student
    for (const s of students) {
      await this.save("students", s.id, s);
    }
  },

  async loadAllStudents() {
    const meta = await this.load("meta", "student_ids");
    if (!meta || !meta.ids || meta.ids.length === 0) return null;
    const students = [];
    for (const id of meta.ids) {
      const s = await this.load("students", id);
      if (s) students.push(s);
    }
    return students.length > 0 ? students : null;
  }
};

function monthKey(y, m) { return y + "-" + String(m).padStart(2,"0"); }
function monthLabel(key) {
  var parts = key.split("-");
  return parts[0] + "년 " + parseInt(parts[1]) + "월";

function currentMonthKey() {
  var now = new Date();
  return monthKey(now.getFullYear(), now.getMonth()+1);
}
function getMonthsList() {
  var months = [], y=2026, m=3;
  var now = new Date(), ny=now.getFullYear(), nm=now.getMonth()+1;
  while (y < ny || (y===ny && m<=nm)) {
    months.push(monthKey(y,m));
    m++; if(m>12){m=1;y++;}
  }
  months.reverse();
  return months;
}

window.doLoginTeacher = function() {
  var inp = document.getElementById("teacherPinInp");
  if (!inp) return;
  var pin = inp.value.toUpperCase();
  if (checkTeacherPin(pin)) {
    pinState.mode = "teacher";
    pinState.pinError = "";
    state.isParent = false;
    state.tab = "dashboard";
    render();
  } else {
    pinState.pinError = "PIN이 올바르지 않습니다.";
    inp.classList.add("error");
    setTimeout(function(){ inp.classList.remove("error"); }, 400);
    inp.value = "";
    var errEl = document.getElementById("pinErrMsg");
    if (errEl) errEl.textContent = pinState.pinError;
  }
};

function updateStudent(id, changes) {
  state.students = state.students.map(s => s.id === id ? { ...s, ...changes } : s);
  autoSave(); render();
}

function addStudent(name, grade, school, pin) {
  if (!pin) pin = "";
  const id = "s" + Date.now();
  state.students.push({
    id, name, grade, school: school || "학교 미정", pin: pin,
    interests: "", gpa: "0.00", narrative: "",
    courses: [], routineRate: 0, weeklyMood: [5,5,5,5,5,5,5],
    nextSession: "", notes: "", activities: [],
    habits: [{ name: "새 습관", streak: 0, target: 21, history: Array(21).fill(0) }],
    energy: Array(24).fill(5), exams: [], narrativeTimeline: [], monthlyReports: [],
  });
  autoSave(); render();
}

function removeStudent(id) {
  if (!confirm("정말 이 학생을 삭제하시겠습니까?")) return;
  state.students = state.students.filter(s => s.id !== id);
  if (state.selectedId === id) state.selectedId = null;
  DataStore.remove("students", id);
  autoSave(); render();
}

function getStudent() { return state.students.find(s => s.id === state.selectedId); }

function editableField(value, onSave, style = "", placeholder = "입력하세요", multiline = false) {
  const id = "ef_" + Math.random().toString(36).substr(2, 9);
  const display = value || `<span style="color:#B0A99F;font-style:italic">${placeholder}</span>`;
  return `<span class="editable" id="${id}" style="${style}" onclick="startEdit('${id}', ${multiline})" title="클릭하여 수정"
    data-value="${(value||'').replace(/"/g, '&quot;')}" data-onsave="${onSave}">${display}</span>`;
}

window.startEdit = function(id, multiline) {
  const el = document.getElementById(id);
  if (!el || el.querySelector("input,textarea")) return;
  const val = el.dataset.value || "";
  const onSave = el.dataset.onsave;
  const style = el.style.cssText;
  if (multiline) {
    el.innerHTML = `<textarea class="edit-input" style="${style}" rows="3">${val}</textarea>`;
  } else {
    el.innerHTML = `<input class="edit-input" style="${style}" value="${val.replace(/"/g, '&quot;')}">`;
  }
  const input = el.querySelector("input,textarea");
  input.focus();
  input.addEventListener("blur", () => { eval(onSave.replace("__VAL__", JSON.stringify(input.value))); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !multiline) { eval(onSave.replace("__VAL__", JSON.stringify(input.value))); }
    if (e.key === "Escape") { render(); }
  });
};

function moodChartSVG(data, h = 48) {
  const max=10,min=1,range=max-min,w=data.length*22;
  let path=`M0,${h}`;data.forEach((d,i)=>{path+=` L${i*22},${h-((d-min)/range)*(h-10)-5}`;});path+=` L${(data.length-1)*22},${h} Z`;
  let line=data.map((d,i)=>`${i*22},${h-((d-min)/range)*(h-10)-5}`).join(" ");
  let dots=data.map((d,i)=>{const cy=h-((d-min)/range)*(h-10)-5;return`<circle cx="${i*22}" cy="${cy}" r="4" fill="#fff" stroke="#2D6A4F" stroke-width="2"/><text x="${i*22}" y="${cy-9}" text-anchor="middle" style="font-size:9px;fill:#5A5550;font-weight:600">${d}</text>`;}).join("");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2D6A4F" stop-opacity="0.25"/><stop offset="100%" stop-color="#2D6A4F" stop-opacity="0"/></linearGradient></defs><path d="${path}" fill="url(#mg)"/><polyline points="${line}" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

function ringSVG(pct, size=68, sw=5) {
  const r=(size-sw)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E8E4DE" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2D6A4F" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c-(pct/100)*c}" stroke-linecap="round" style="transition:stroke-dashoffset 0.6s"/><text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" style="transform:rotate(90deg);transform-origin:center;font-size:${size*0.22}px;font-weight:800;fill:#1B1815">${pct}%</text></svg>`;
}

function energyBarHTML(data) {
  const max=Math.max(...data);
  const bars=data.map((v,i)=>{const hue=v>=7?150:v>=4?40:0;return`<div style="flex:1;height:${(v/max)*100}%;min-height:3px;background:hsl(${hue},${60+v*3}%,${50+(10-v)*2}%);border-radius:3px 3px 0 0" title="${i}:00 — ${v}/10"></div>`;}).join("");
  const labels=["12a","","","3a","","","6a","","","9a","","","12p","","","3p","","","6p","","","9p","","",""].map(l=>`<div style="flex:1;font-size:8px;color:#9A958C;text-align:center">${l}</div>`).join("");
  return `<div style="display:flex;gap:2px;align-items:end;height:60px">${bars}</div><div style="display:flex;gap:2px;margin-top:4px">${labels}</div>`;
}

function crisisHTML(mood, routineRate) {
  const r=mood.slice(-3);const dec=r.every((v,i)=>i===0||v<=r[i-1])&&r[2]<r[0];const a=[];
  if(dec)a.push("무드 3일 연속 하락");if(routineRate<60)a.push("루틴 60% 미만");if(r[r.length-1]<=4)a.push("최근 무드 4 이하");
  if(!a.length)return"";
  return`<div style="background:${a.length>=2?"#FFF0F0":"#FFF8E1"};border:1.5px solid ${a.length>=2?"#FF5252":"#FFB74D"};border-radius:12px;padding:12px 16px;margin-bottom:16px"><div style="font-weight:700;font-size:13px;color:${a.length>=2?"#C62828":"#E65100"};margin-bottom:6px">${a.length>=2?"🚨 위기 감지 — 즉시 개입 필요":"⚠️ 주의 신호 감지"}</div><div style="font-size:12px;color:#5A5550">${a.join(" · ")}</div></div>`;
}

  var reports = (student.monthlyReports||[]).slice().sort(function(a,b){ return b.monthKey.localeCompare(a.monthKey); });

  var reportsHTML = reports.length === 0
    ? '<div style="text-align:center;padding:60px 20px;color:#9A958C"><div style="font-size:40px;margin-bottom:12px">📋</div><div style="font-weight:600">아직 작성된 리포트가 없어요</div></div>'
    : reports.map(function(r) {
        var scoreCards = [
          {l:"GPA",v:r.gpa||"-",bg:"#E8F5E9",c:"#1B4332"},
          {l:"루틴 달성률",v:(r.routineRate||"-")+"%",bg:"#FFF8E1",c:"#E65100"},
          {l:"학습 태도",v:r.attitudeScore?("⭐".repeat(parseInt(r.attitudeScore))):"-",bg:"#F3E8FF",c:"#6A1B9A"}
        ].map(function(x){ return '<div style="background:'+x.bg+';padding:12px;border-radius:10px;text-align:center"><div style="font-size:10px;color:#7A7267">'+x.l+'</div><div style="font-size:16px;font-weight:900;color:'+x.c+';margin-top:4px">'+x.v+'</div></div>'; }).join("");
        var dateStr = r.updatedAt ? new Date(r.updatedAt).toLocaleDateString("ko-KR") : "";
        return '<div class="parent-view-card">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #F0EDE8">' +
          '<span style="background:#1B4332;color:white;padding:4px 12px;border-radius:16px;font-size:12px;font-weight:800">' + monthLabel(r.monthKey) + '</span>' +
          '<span style="font-size:11px;color:#9A958C">' + dateStr + '</span></div>' +
          '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">' + scoreCards + '</div>' +
          (r.academicProgress ? '<div style="margin-bottom:12px"><div style="font-size:10px;font-weight:700;color:#9A958C;margin-bottom:5px">📚 학습 진도</div><div style="font-size:13px;color:#3A3530;line-height:1.7">'+r.academicProgress+'</div></div>' : "") +
          (r.goal ? '<div style="margin-bottom:12px"><div style="font-size:10px;font-weight:700;color:#9A958C;margin-bottom:5px">🎯 이번 달 목표</div><div style="font-size:13px;color:#3A3530;line-height:1.7">'+r.goal+'</div>'+(r.goalResult?'<div style="margin-top:6px;padding:6px 10px;background:#F0FAF5;border-radius:8px;font-size:12px;color:#2D6A4F;font-weight:600">달성: '+r.goalResult+'</div>':"")+'</div>' : "") +
          (r.teacherComment ? '<div class="parent-comment"><div style="font-size:10px;font-weight:800;color:#1B4332;margin-bottom:6px">💬 선생님 코멘트</div><div style="font-size:13px;color:#2D6A4F;line-height:1.7;font-style:italic">'+r.teacherComment+'</div></div>' : "") +
          (r.nextPlan ? '<div class="parent-next"><div style="font-size:10px;font-weight:800;color:#E65100;margin-bottom:6px">📅 다음 달 계획</div><div style="font-size:13px;color:#5A5550;line-height:1.7">'+r.nextPlan+'</div></div>' : "") +
          '</div>';
      }).join("");

  document.getElementById("app").innerHTML =
    '<div style="padding:14px 24px;border-bottom:1px solid #DDD8D0;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:50">' +
    '<div style="display:flex;align-items:center;gap:12px"><div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#1B4332,#52B788);display:flex;align-items:center;justify-content:center"><span style="color:white;font-weight:900;font-size:15px;font-family:Playfair Display,serif">LU</span></div><div><div style="font-family:Playfair Display,serif;font-weight:900;font-size:18px;color:#1B4332">Lit You Up</div><div style="font-size:10px;color:#9A958C">학부모 리포트 열람</div></div></div>' +
    '<div style="display:flex;align-items:center;gap:10px"><span style="background:#FFF3E0;color:#BF360C;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">👨‍👩‍👧 ' + student.name + ' 학부모</span><button onclick="doLogout()" style="padding:6px 12px;border-radius:8px;border:1px solid #E8E4DE;background:white;cursor:pointer;font-size:12px;color:#7A7267;font-family:inherit">로그아웃</button></div></div>' +
    '<div style="padding:24px;max-width:900px;margin:0 auto">' +
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:18px;background:white;border-radius:14px;border:1px solid #E8E4DE">' +
    '<div style="width:48px;height:48px;border-radius:50%;background:#E8F5E9;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#1B4332;flex-shrink:0">' + student.name.charAt(0) + '</div>' +
    '<div><div style="font-weight:800;font-size:18px">' + student.name + '</div><div style="font-size:12px;color:#9A958C">' + student.school + ' · ' + student.grade + '학년</div>' +
    (student.narrative ? '<div style="font-size:12px;color:#2D6A4F;font-style:italic;margin-top:3px">"' + student.narrative + '"</div>' : "") +
    '</div></div>' + reportsHTML + '</div>';
}

if ('serviceWorker' in navigator) {
  // Minimal inline service worker for PWA install capability
  const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// ═══ INIT ═══
loadData();
</script>
</body>
</html>
