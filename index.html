var saveTimer = null;

function showSaved(){var el=document.getElementById("saveInd");if(!el)return;el.classList.add("show");setTimeout(function(){el.classList.remove("show");},1800);}
function normalizePin(p){return(p||"").trim().toUpperCase();}
function checkTeacherPin(p){return normalizePin(p)===normalizePin(TEACHER_PIN);}
function checkStudentPin(st,p){return normalizePin(p)===normalizePin(st.pin||"");}
function validatePin(p){return /^[A-Z][0-9]{5}$/.test(normalizePin(p));}
function monthKey(y,m){return y+"-"+String(m).padStart(2,"0");}
function monthLabel(mk){var p=mk.split("-");return p[0]+"년 "+parseInt(p[1])+"월";}
function currentMonthKey(){var n=new Date();return monthKey(n.getFullYear(),n.getMonth()+1);}
function getMonths(){
  var months=[],y=2026,m=3,n=new Date(),ny=n.getFullYear(),nm=n.getMonth()+1;
  while(y<ny||(y===ny&&m<=nm)){months.push(monthKey(y,m));m++;if(m>12){m=1;y++;}}
  months.reverse(); return months;
}
function getStudent(){return state.students.find(function(s){return s.id===state.selectedId;});}
function getStudentById(id){return state.students.find(function(s){return s.id===id;});}
function getReport(studentId,mk){
  var s=getStudentById(studentId);
  if(!s||!s.reports)return null;
  return s.reports.find(function(r){return r.monthKey===mk;})||null;
}

var DS={
  save:async function(col,id,data){
    try{if(firebaseReady)await db.collection(col).doc(id).set(data,{merge:true});}catch(e){}
    localStorage.setItem("lyu_"+col+"_"+id,JSON.stringify(Object.assign({},data,{_id:id})));
  },
  load:async function(col,id){
    try{if(firebaseReady){var doc=await db.collection(col).doc(id).get();if(doc.exists)return doc.data();}}catch(e){}
    var l=localStorage.getItem("lyu_"+col+"_"+id);return l?JSON.parse(l):null;
  },
  remove:async function(col,id){
    try{if(firebaseReady)await db.collection(col).doc(id).delete();}catch(e){}
    localStorage.removeItem("lyu_"+col+"_"+id);
  }
};

function autoSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async function(){
    await DS.save("meta","student_ids",{ids:state.students.map(function(s){return s.id;})});
    for(var i=0;i<state.students.length;i++){await DS.save("students",state.students[i].id,state.students[i]);}
    await DS.save("config","roadmap",state.roadmap);
    await DS.save("config","settings",{appsScriptUrl:state.appsScriptUrl,teacherEmail:state.teacherEmail});
    showSaved();
  },800);
}

async function loadData(){
  var meta=await DS.load("meta","student_ids");
  if(meta&&meta.ids&&meta.ids.length){
    var arr=[];
    for(var i=0;i<meta.ids.length;i++){var s=await DS.load("students",meta.ids[i]);if(s)arr.push(s);}
    state.students=arr.length?arr:getDefaultStudents();
  }else{state.students=getDefaultStudents();}
  var rm=await DS.load("config","roadmap");if(rm)state.roadmap=rm;
  var cfg=await DS.load("config","settings");
  if(cfg){state.appsScriptUrl=cfg.appsScriptUrl||"";state.teacherEmail=cfg.teacherEmail||"ginnie1004@gmail.com";}
  state.loaded=true; render();
}

function updateStudent(id,changes){
  state.students=state.students.map(function(s){return s.id===id?Object.assign({},s,changes):s;});
  autoSave(); render();
}

function saveReport(studentId,mk,data){
  state.students=state.students.map(function(s){
    if(s.id!==studentId)return s;
    var reports=(s.reports||[]).slice();
    var idx=reports.findIndex(function(r){return r.monthKey===mk;});
    var report=Object.assign({monthKey:mk},data,{updatedAt:new Date().toISOString()});
    if(idx>=0)reports[idx]=report;else reports.unshift(report);
    return Object.assign({},s,{reports:reports});
  });
  autoSave();
}

function fmtReport(st,r){
  var lines=["📋 Lit You Up — "+st.name+" 리포트",monthLabel(r.monthKey),"━".repeat(20)];
  if(r.gpa)lines.push("📊 GPA: "+r.gpa);
  if(r.routineRate)lines.push("🔄 루틴 달성률: "+r.routineRate+"%");
  if(r.academicProgress)lines.push("\n📚 학습 진도:\n"+r.academicProgress);
  if(r.goal)lines.push("\n🎯 목표:\n"+r.goal);
  if(r.goalResult)lines.push("달성 결과: "+r.goalResult);
  if(r.teacherComment)lines.push("\n💬 선생님 코멘트:\n"+r.teacherComment);
  if(r.nextPlan)lines.push("\n📅 다음 달 계획:\n"+r.nextPlan);
  return lines.join("\n");
}

window.shareKakao=function(studentId,mk){

};

function ringSVG(pct,size,sw){
  size=size||60;sw=sw||4;
  var r=(size-sw)/2,c=2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)"><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#E8E4DE" stroke-width="'+sw+'"/><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#2D6A4F" stroke-width="'+sw+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-(pct/100)*c)+'" stroke-linecap="round"/><text x="'+(size/2)+'" y="'+(size/2)+'" text-anchor="middle" dominant-baseline="central" style="transform:rotate(90deg);transform-origin:center;font-size:'+Math.round(size*0.22)+'px;font-weight:800;fill:#1B1815">'+pct+'%</text></svg>';
}

// efn: editable field using DOM to avoid quote issues
function efn(value,onSave,style,placeholder,multi){
  style=style||"";placeholder=placeholder||"입력하세요";multi=multi||false;
  var id="ef_"+Math.random().toString(36).substr(2,8);
  var el=document.createElement("span");
  el.className="editable"; el.id=id; el.style.cssText=style;
  el.setAttribute("data-value",value||"");
  el.setAttribute("data-onsave",onSave);
  el.setAttribute("data-multi",multi?"true":"false");
  el.title="클릭하여 수정";
  el.innerHTML=value||('<span style="color:#B0A99F;font-style:italic">'+placeholder+"</span>");
  el.onclick=function(){startEdit(id);};
  return el.outerHTML;
}

window.startEdit=function(id){
  var el=document.getElementById(id);
  if(!el||el.querySelector("input,textarea"))return;
  var val=el.getAttribute("data-value")||"";
  var onSave=el.getAttribute("data-onsave");
  var multi=el.getAttribute("data-multi")==="true";
  el.innerHTML=multi?('<textarea class="edit-input" rows="3">'+val+"</textarea>"):('<input class="edit-input" value="">');
  var inp=el.querySelector("input,textarea");
  if(!multi&&inp.tagName==="INPUT")inp.value=val;
  inp.focus();
  inp.onblur=function(){eval(onSave.replace("__VAL__",JSON.stringify(inp.value)));};
  inp.onkeydown=function(e){if(e.key==="Enter"&&!multi)eval(onSave.replace("__VAL__",JSON.stringify(inp.value)));if(e.key==="Escape")render();};
};

// ═══ ACTIONS ═══
window.saveRpt=function(studentId,mk){
  var get=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
  var data={gpa:get("rGpa"),routineRate:get("rRoutine"),academicProgress:get("rAcademic"),attitudeScore:get("rAttScore"),attitude:get("rAttitude"),goal:get("rGoal"),goalResult:get("rGoalResult"),habitNote:get("rHabit"),teacherComment:get("rComment"),nextPlan:get("rNext")};
  saveReport(studentId,mk,data);showSaved();
};
window.setAttScore=function(n){document.getElementById("rAttScore").value=n;document.querySelectorAll("#starRow .star").forEach(function(s,i){s.textContent=i<n?"⭐":"☆";});};
window.saveRoadmap=function(grade){
  var t=(document.getElementById("rmTitle")||{}).value||"";
  var sub=(document.getElementById("rmSub")||{}).value||"";
  var c=(document.getElementById("rmContent")||{}).value||"";
  state.roadmap[grade]={title:t,sub:sub,content:c};autoSave();showSaved();
};
window.saveSettings=function(){
  state.appsScriptUrl=((document.getElementById("cfgScript")||{}).value||"").trim();
  state.teacherEmail=((document.getElementById("cfgEmail")||{}).value||"").trim();
  DS.save("config","settings",{appsScriptUrl:state.appsScriptUrl,teacherEmail:state.teacherEmail});
  var msg=document.getElementById("cfgMsg");if(msg)msg.textContent="✅ 저장됐습니다.";
};
window.doSetPin=function(id){
  var pin=((document.getElementById("newPinVal")||{}).value||"").toUpperCase();
  if(!validatePin(pin)){var msg=document.getElementById("pinMsg");if(msg){msg.textContent="❌ 형식 오류: 영문1+숫자5";msg.style.color="#C62828";}return;}
  updateStudent(id,{pin:pin});var msg=document.getElementById("pinMsg");if(msg){msg.textContent="✅ PIN: "+pin+"으로 설정됐습니다.";msg.style.color="#2D6A4F";}
};
window.doAddStudent=function(){
  var name=((document.getElementById("nName")||{}).value||"").trim();
  var school=((document.getElementById("nSchool")||{}).value||"").trim();
  var grade=(document.getElementById("nGrade")||{}).value||"9";
  var pin=((document.getElementById("nPin")||{}).value||"").toUpperCase();
  var phone=((document.getElementById("nPhone")||{}).value||"").trim();
  var kakao=((document.getElementById("nKakao")||{}).value||"").trim();
  if(!name){alert("이름을 입력해주세요.");return;}
  if(!validatePin(pin)){var err=document.getElementById("nPinErr");if(err)err.textContent="PIN 형식 오류: 영문1+숫자5 (예: A12345)";return;}
  var id="s"+Date.now();
  state.students.push({id:id,name:name,grade:grade,school:school||"학교 미정",pin:pin,phone:phone,kakaoLink:kakao,interests:"",gpa:"0.00",narrative:"",routineRate:0,notes:"",courses:[],activities:[],narrativeTimeline:[],reports:[]});
  autoSave();hideAddModal();render();
};
window.removeStudent=function(id){
  if(!confirm("정말 이 학생을 삭제하시겠습니까?"))return;
  state.students=state.students.filter(function(s){return s.id!==id;});
  if(state.selectedId===id)state.selectedId=null;
  DS.remove("students",id);autoSave();render();
};
window.updateStudent=function(id,changes){
  state.students=state.students.map(function(s){return s.id===id?Object.assign({},s,changes):s;});
  autoSave();render();
};
